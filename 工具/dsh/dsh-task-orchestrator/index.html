<style>
:root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color:#263653;background:#f8faff;font-size:13px;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #8092f5;outline-offset:2px}.app{height:100vh;min-height:420px;display:flex;flex-direction:column;background:white}.toolbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 27px;border-bottom:1px solid #e9edf5;gap:15px}.title{font-weight:750;color:#253654;font-size:15px}.title span{font-weight:400;font-size:12px;color:#a4b0c2;margin-left:8px}.top-actions{display:flex;align-items:center;gap:10px}.tag{font-size:11px;color:#7b8acc;background:#f1f3ff;border-radius:6px;padding:6px 9px}.button{border:1px solid #e5eaf3;border-radius:7px;background:#fff;color:#617089;padding:7px 11px;font-size:11px;font-weight:600}.button:hover{border-color:#a9b7ed;color:#6172d4}.button.primary{background:#7182e8;border-color:#7182e8;color:white}.canvas{flex:1;position:relative;overflow:auto;background-color:#fafbfe;background-image:radial-gradient(#d6dfee 1px,transparent 1px);background-size:20px 20px}.canvas-inner{position:relative;min-width:100%;min-height:100%}.links{position:absolute;inset:0;pointer-events:none}.links path{stroke:#c8d3e5;stroke-width:1.4;fill:none}.links path.dependency{stroke:#b9c4d4;stroke-width:1.6}.links path.dependency.satisfied{stroke:#60c6a3}.links path.dependency.blocked{stroke:#dd7777}.dependency-list{max-height:140px;overflow:auto;border:1px solid #e3e9f2;border-radius:7px;padding:8px}.dependency-list label{display:flex;gap:7px;padding:4px;color:#617089}.dependency-list input{accent-color:#7182e8}.node{position:absolute;width:176px;height:160px;border:1px solid #dce4f0;background:#fff;border-radius:12px;box-shadow:0 4px 12px #687a9a0c;color:inherit;text-align:left;padding:0;transition:b 7be;width:16px;text-align:center}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#1e2c4880;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.dialog{width:480px;max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:13px;box-shadow:0 20px 60px #1e2c4830}.dialog-head{padding:20px 22px 16px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;align-items:center}.dialog-head h2{margin:0;font-size:15px;color:#273753}.close{border:0;background:transparent;color:#a1adbf;font-size:19px;line-height:1}.dialog-body{padding:18px 22px}.field{display:block;margin-bottom:14px}.field>span{display:block;color:#7888a1;font-size:11px;font-weight:600;margin-bottom:7px}.input{width:100%;border:1px solid #e3e9f2;border-radius:7px;background:#fbfcfe;color:#465772;padding:9px 10px;font-size:12px}.input:focus{border-color:#9aabf0}.input:disabled{background:#f2f5fa;color:#7888a0;cursor:not-allowed}textarea.input{resize:vertical;min-height:65px;line-height:1.5}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.options{border:1px solid #ebeff5;border-radius:8px;padding:11px 12px;margin-bottom:14px}.options-title{font-size:11px;font-weight:700;color:#70809a;margin-bottom:10px}.check-row{display:flex;gap:20px;color:#677893;font-size:11px}.check-row label{display:flex;align-items:center;gap:6px;cursor:pointer}.check-row input{accent-color:#7182e8}.output-fields{margin-top:13px}.dialog-note{background:#f6f8ff;color:#98a5bf;border-radius:7px;padding:10px 11px;font-size:10px;line-height:1.6}.dialog-foot{border-top:1px solid #edf0f5;padding:14px 22px;display:flex;justify-content:flex-end;gap:8px}.dialog-foot .button{font-size:12px;padding:8px 15px}.toast{position:fixed;right:22px;bottom:22px;background:#263653;color:white;border-radius:7px;padding:10px 13px;z-index:20;font-size:12px;box-shadow:0 8px 20px #26365325}@media(max-width:600px){.toolbar{padding:0 15px}.title span{display:none}.tag{display:none}.row{grid-template-columns:1fr}}
.run-banner{flex:none;background:#fff;border-bottom:1px solid #e9edf5;padding:15px 27px;display:flex;align-items:center;gap:30px;min-width:0}.run-item{display:flex;align-items:center;gap:11px;min-width:0}.run-icon{width:35px;height:35px;flex:none;border-radius:9px;background:#edf0ff;color:#7889e4;display:grid;place-items:center;font-size:16px}.run-icon.state{background:#f1f5fb;color:#8392ab}.run-copy{min-width:0}.run-label{font-size:10px;color:#a2afc1;margin-bottom:5px}.run-value{font-size:12px;font-weight:650;color:#4d5d78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.state-badge{display:inline-flex;align-items:center;gap:6px;color:#7888a0;font-weight:650}.state-badge:before{content:'';width:7px;height:7px;border-radius:50%;background:#b5c0cf}.run-separator{width:1px;height:32px;background:#edf0f6;flex:none}.run-path{flex:1}.edit-path{margin-left:auto;flex:none}.path-form-note{margin-top:3px}.path-form-note code{font-size:10px}@media(max-width:600px){.run-banner{padding:12px 15px;gap:12px}.run-icon{display:none}.run-separator{display:none}.run-item{gap:5px}.run-label{font-size:10px}.run-value{font-size:11px}.edit-path{padding:6px}}
.hook-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.hook-header .options-title{margin:0}.hook-add{border:0;background:#f1f3ff;color:#6f7ed5;border-radius:6px;padding:6px 9px;font-size:11px}.hook-row{display:flex;gap:7px;align-items:center;margin-top:8px}.hook-row select{min-width:0;flex:1}.hook-remove{border:1px solid #e7ecf3;background:white;border-radius:6px;color:#a3aec0;width:32px;height:34px;flex:none;font-size:16px}.hook-empty{color:#a5b1c2;font-size:11px;line-height:1.6}.hook-legacy{margin-top:10px;color:#a08155;background:#fff8ed;border-radius:6px;font-size:10px;line-height:1.6;padding:8px}.hook-clear{border:0;background:none;color:#b0874f;cursor:pointer;padding:0;text-decoration:underline;font-size:10px}
.condition-hint{display:block;margin-top:6px;color:#a1aec1;font-size:10px;line-height:1.5;font-weight:400}.hook-card{margin:10px 0 0;padding:11px;border:1px solid #e8edf5;border-radius:8px;background:#fbfcff}.hook-card .hook-row{margin:0 0 11px}.hook-card .field{margin-bottom:10px}.hook-card textarea.input{min-height:60px}.hook-output-toggle{display:flex;align-items:center;gap:6px;color:#677893;font-size:11px;cursor:pointer}.hook-output-toggle input{accent-color:#7182e8}.hook-output-fields{margin-top:11px;padding:10px;background:white;border:1px solid #edf0f6;border-radius:7px}.hook-output-fields .field:last-child{margin-bottom:0}.hook-output-fields textarea.input{min-height:55px}

<body>
<main class="app"><header class="toolbar"><div class="title">流程画布<span>/ 可视化编排</span></div><div class="top-actions"><span class="tag">交互演示</span><button class="button" id="reset">重置示例</button></div></header><section class="run-banner" aria-label="流程运行信息"><div class="run-item"><div class="run-icon state">◷</div><div class="run-copy"><div class="run-label">运行状态</div><div class="run-value"><span class="state-badge">未运行</span></div></div></div><div class="run-separator"></div><div class="run-item run-path"><div class="run-icon">▤</div><div class="run-copy"><div class="run-label">运行状态 JSON 文件地址</div><div class="run-value" id="runPathDisplay"></div></div></div><button class="button edit-path" id="editRunPath">编辑地址</button></section><section class="canvas" id="canvas" aria-label="流程画布"><div class="canvas-inner" id="canvasInner"><svg class="links" id="links" aria-hidden="true"></svg><div id="nodes"></div></div></section><div class="tip">箭头：执行依赖　灰色：未满足　绿色：已满足　红色：阻塞</div></main>
<div class="context-menu hidden" id="menu" role="menu"><button type="button" role="menuitem" id="editNode"><span class="menu-icon">✎</span>编辑节点</button><button type="button" role="menuitem" id="addChild"><span class="menu-icon">＋</span>新增子节点</button></div>
<div class="overlay hidden" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">编辑节点</h2><button class="close" type="button" id="closeDialog" aria-label="关闭">×</button></div><form id="nodeForm"><div class="dialog-body"><label class="field"><span>节点名称</span><input class="input" name="name" required maxlength="80" placeholder="例如：需求分析"></label><div class="row"><label class="field"><span>节点类型</span><select class="input" name="type"><option value="main" hidden>主会话</option><option value="agent">子代理</option><option value="approval">人工确认</option><option value="output">结果输出</option><option value="custom">自定义节点</option></select></label><label class="field"><span>步骤模板 / 执行角色</span><input class="input" name="template" placeholder="例如：需求分析师"></label></div><label class="field"><span>执行会话</span><select class="input" name="executionSession"></select><span class="condition-hint" id="sessionHint"></span></label><div class="field"><span>前置依赖（全部成功后触发）</span><div id="dependencyList" class="dependency-list"></div><span class="condition-hint">已排除自身、循环依赖和已间接依赖的节点；没有依赖时可并行调度。</span></div><label class="field"><span>节点说明（该节点要达成的最终目标）</span><textarea class="input" name="desc" placeholder="描述本节点需要完成的目标与预期结果"></textarea></label><div class="options"><div class="hook-header"><div class="options-title">当前节点的 Hook 事件</div><button class="hook-add" type="button" id="addHook">＋ 添加事件</button></div><div id="hookRows"></div><div class="hook-legacy hidden" id="legacyNotice">旧版前置 / 后置标记没有对应的 DSH 事件，请手动选择事件。<br><button type="button" class="hook-clear" id="clearLegacy">清除旧标记</button></div></div><div class="dialog-note">此页面用于交互演示，配置保存在当前浏览器，不会实际调用 DSH 或写入输出文件。</div></div><div class="dialog-foot"><button class="button" type="button" id="cancel">取消</button><button class="button primary" type="submit">保存</button></div></form></section></div><div class="overlay hidden" id="pathOverlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="pathTitle"><div class="dialog-head"><h2 id="pathTitle">运行状态文件地址</h2><button class="close" type="button" id="closePath" aria-label="关闭">×</button></div><form id="pathForm"><div class="dialog-body"><label class="field"><span>JSON 文件地址</span><input class="input" id="runPathInput" required placeholder="输入文件地址"></label><div class="dialog-note path-form-note">可使用 <code>${workspace}</code> 和 <code>${runId}</code> 表示工作区及运行标识。演示页面只保存地址配置，不会创建文件。</div></div><div class="dialog-foot"><button class="button" type="button" id="cancelPath">取消</button><button class="button primary" type="submit">保存</button></div></form></section></div><div class="toast hidden" id="toast" role="status"></div>
<script>
const defaults=[{id:'requirement',parent:null,name:'需求分析',type:'main',desc:'理解需求并整理任务范围',template:'需求分析师',pre:true,post:true,output:false,format:'JSON',path:''},{id:'design',parent:'requirement',dependencies:['requirement'],name:'方案设计',type:'agent',desc:'制定方案与实现步骤',template:'方案设计师',pre:true,post:false,output:false,format:'JSON',path:''},{id:'implement',parent:'design',dependencies:['design'],name:'开发实现',type:'agent',desc:'按照方案完成开发任务',template:'开发工程师',pre:true,post:true,output:false,format:'JSON',path:''},{id:'review',parent:'implement',dependencies:['implement'],name:'人工确认',type:'approval',desc:'检查执行结果并确认继续',template:'人工审核',pre:false,post:false,output:false,format:'JSON',path:''}];
const kinds={main:{label:'主会话',icon:'✦'},agent:{label:'子代理',icon:'✧'},approval:{label:'人工节点',icon:'♙'},output:{label:'输出节点',icon:'⇩'},custom:{label:'自定义节点',icon:'◇'}};
// 节点生命周期由中台定义；其他选项参考本机 DSH v0.2.2-rc.3 的 Cordis 事件。
const hookEvents=[
  {group:'节点生命周期（中台定义）',items:[['orchestrator/node-before','节点开始前'],['orchestrator/node-end','节点结束']]},
  {group:'Agent 生命周期',items:[['agent/created','Agent 创建完成'],['agent/disposed','Agent 已释放'],['agent/error','Agent 发生错误'],['agent/status','Agent 状态变化'],['agent/pre-step','步骤输入准入（waterfall）'],['agent/request-error','模型请求异常（waterfall）'],['agent/turn-stopping','当前轮次准备结束（serial）'],['agent/assistant-stream','助手流式输出通知']]},
  {group:'子代理',items:[['subagent/start','子代理启动通知'],['subagent/end','子代理结束通知']]},
  {group:'工具执行',items:[['tools/pre-execute','工具执行前（waterfall）'],['tools/execute','工具执行（waterfall）'],['tools/post-execute','工具执行后（waterfall）'],['tools/result','工具最终结果通知'],['tools/change','工具注册变化通知']]},
  {group:'文件操作',items:[['fs/write-intent','文件写入意图（waterfall）'],['fs/edit-intent','文件编辑意图（waterfall）'],['fs/delete-intent','文件删除意图（waterfall）'],['fs/observed','文件状态观察通知']]}
];
const hookLabels=new Map(hookEvents.flatMap(group=>group.items));let draftHooks=[],legacyCleared=false;
function hookOptions(selected){return '<option value="">请选择触发事件</option>'+hookEvents.map(group=>`<optgroup label="${escapeHtml(group.group)}">${group.items.map(([value,label])=>`<option value="${escapeHtml(value)}" ${value===selected?'selected':''}>${escapeHtml(value)} — ${escapeHtml(label)}</option>`).join('')}</optgroup>`).join('')}
function normalizeHook(hook){if(typeof hook==='string')return {event:hook,action:'',nextCondition:'',output:{enabled:false,format:'JSON',path:'',template:''}};return {event:hook?.event||'',action:hook?.action||'',nextCondition:hook?.nextCondition||'',output:{enabled:Boolean(hook?.output?.enabled),format:hook?.output?.format||'JSON',path:hook?.output?.path||'',template:hook?.output?.template||''}}}
function renderHookRows(){const rows=$('#hookRows');rows.innerHTML=draftHooks.length?draftHooks.map((hook,index)=>`<div class="hook-card"><div class="hook-row"><select class="input hook-select" data-index="${index}" data-hook-field="event" aria-label="触发事件 ${index+1}" required>${hookOptions(hook.event)}</select><button type="button" class="hook-remove" data-remove="${index}" aria-label="移除事件 ${index+1}">×</button></div><label class="field"><span>动作描述</span><textarea class="input" data-index="${index}" data-hook-field="action" aria-label="事件 ${index+1} 动作描述" placeholder="描述事件触发后需要执行的动作">${escapeHtml(hook.action)}</textarea></label><label class="field next-condition ${hook.event==='orchestrator/node-end'?'':'hidden'}"><span>进入下一个节点的条件说明</span><textarea class="input" data-index="${index}" data-hook-field="nextCondition" aria-label="事件 ${index+1} 进入下一个节点的条件说明" placeholder="例如：需求已确认，且没有未解决的问题">${escapeHtml(hook.nextCondition)}</textarea><span class="condition-hint">由中台结合节点结果判断；当前为配置演示。</span></label><label class="hook-output-toggle"><input type="checkbox" data-index="${index}" data-hook-field="enabled" ${hook.output.enabled?'checked':''}> 节点结果输出（可选）</label><div class="hook-output-fields ${hook.output.enabled?'':'hidden'}"><div class="row"><label class="field"><span>输出格式</span><input class="input" data-index="${index}" data-hook-field="format" aria-label="事件 ${index+1} 输出格式" value="${escapeHtml(hook.output.format)}" placeholder="例如：JSON"></label><label class="field"><span>输出路径</span><input class="input" data-index="${index}" data-hook-field="path" aria-label="事件 ${index+1} 输出路径" value="${escapeHtml(hook.output.path)}" placeholder="自定义文件地址" ${hook.output.enabled?'required':''}></label></div><label class="field"><span>输出内容 / 格式说明（可选）</span><textarea class="input" data-index="${index}" data-hook-field="template" aria-label="事件 ${index+1} 输出内容格式" placeholder="描述输出内容，或填写 JSON 格式示例">${escapeHtml(hook.output.template)}</textarea></label></div></div>`).join(''):'<div class="hook-empty">尚未配置事件，可添加节点生命周期或 DSH 事件。</div>'}
const storageKey='dsh-flow-canvas-demo-v2', $=s=>document.querySelector(s), escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let nodes=structuredClone(defaults),selected=null,mode='edit',toastTimer;try{let saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(Array.isArray(saved)&&saved.length&&saved.every(n=>n.id&&kinds[n.type]))nodes=saved}catch{}
// 兼容已有画布：仅将第一个根节点识别为主会话，保留它的其他配置。
const rootNode=nodes.find(node=>node.parent===null);if(rootNode)rootNode.type='main';
function save(){try{localStorage.setItem(storageKey,JSON.stringify(nodes))}catch{showToast('浏览器无法保存，刷新后可能丢失修改')}}
function showToast(text){let el=$('#toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2400)}
function sessionParent(node){if(!node.parent)return null;const choice=node.executionSession||'parent';if(choice==='root')return nodes.find(n=>n.parent===null)?.id||node.parent;if(choice.startsWith('node:'))return choice.slice(5);return node.parent}
function sessionLabel(node){const root=nodes.find(n=>n.parent===null);if(!node.parent)return '根主会话';const choice=node.executionSession||'parent';const target=choice==='root'?root:choice.startsWith('node:')?nodes.find(n=>n.id===choice.slice(5)):nodes.find(n=>n.id===node.parent);return target?target.name+(target===root?'（主会话）':''):'会话不可用'}
function render(){
 const canvas=$('#canvas'),inner=$('#canvasInner'),pos=new Map(),levels=new Map(),visiting=new Set();
 function depth(node){if(levels.has(node.id))return levels.get(node.id);if(visiting.has(node.id))return 0;visiting.add(node.id);const parents=(node.dependencies||[]).map(id=>nodes.find(n=>n.id===id)).filter(Boolean);const value=parents.length?1+Math.max(...parents.map(depth)):0;visiting.delete(node.id);levels.set(node.id,value);return value}
 const columns=new Map();for(const n of nodes){const d=depth(n),col=columns.get(d)||[];col.push(n);columns.set(d,col)}
 const longEdges=nodes.reduce((count,n)=>count+(n.dependencies||[]).filter(id=>levels.has(id)&&levels.get(n.id)-levels.get(id)>1).length,0), laneSpace=longEdges?longEdges*14+24:0;const maxRows=Math.max(1,...[...columns.values()].map(c=>c.length)),maxDepth=Math.max(0,...columns.keys());const graphHeight=Math.max(canvas.clientHeight,maxRows*195+60+laneSpace),graphWidth=Math.max(canvas.clientWidth,42+maxDepth*240+220);inner.style.width=graphWidth+'px';inner.style.height=graphHeight+'px';$('#links').setAttribute('width',graphWidth);$('#links').setAttribute('height',graphHeight);
 for(const [d,col] of columns){const start=Math.max(30+laneSpace,laneSpace+(graphHeight-laneSpace-(col.length-1)*195-160)/2);col.forEach((n,i)=>pos.set(n.id,{x:42+d*240,y:start+i*195}))}
 const paths=[];let topLane=0,bottomLane=0,routeHeight=graphHeight;for(const n of nodes){const c=pos.get(n.id);for(const id of n.dependencies||[]){const p=pos.get(id);if(!p||!c)continue;const source=nodes.find(x=>x.id===id);const state=source?.status==='completed'?'satisfied':['failed','cancelled'].includes(source?.status)?'blocked':'';const x1=p.x+176,y1=p.y+80,x2=c.x,y2=c.y+80,mid=(x1+x2)/2;const long=levels.get(n.id)-levels.get(id)>1;let route;
 if(long){const between=[...pos.values()].filter(point=>point.x>=p.x&&point.x<=c.x);const upper=Math.min(...between.map(point=>point.y))-22-topLane*14,lower=Math.max(...between.map(point=>point.y+160))+22+bottomLane*14;const useTop=Math.abs(y1-upper)+Math.abs(y2-upper)<=Math.abs(y1-lower)+Math.abs(y2-lower);const laneY=useTop?upper:lower;if(useTop)topLane++;else bottomLane++;routeHeight=Math.max(routeHeight,laneY+24);const sx=x1+18,tx=x2-18,r=8,d1=Math.sign(laneY-y1),d2=Math.sign(y2-laneY);route=`M ${x1} ${y1} L ${sx-r} ${y1} Q ${sx} ${y1} ${sx} ${y1+d1*r} L ${sx} ${laneY-d1*r} Q ${sx} ${laneY} ${sx+r} ${laneY} L ${tx-r} ${laneY} Q ${tx} ${laneY} ${tx} ${laneY+d2*r} L ${tx} ${y2-d2*r} Q ${tx} ${y2} ${tx+r} ${y2} L ${x2-6} ${y2}`}
 else route=`M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2-6} ${y2}`;paths.push(`<path class="dependency ${state}" d="${route}"/><path class="dependency ${state}" d="M ${x2-11} ${y2-4} L ${x2-6} ${y2} L ${x2-11} ${y2+4}"/>`)}}inner.style.height=routeHeight+'px';$('#links').setAttribute('height',routeHeight);$('#links').innerHTML=paths.join('');
 $('#nodes').innerHTML=nodes.map(n=>{const p=pos.get(n.id);if(!p)return '';const kind=kinds[n.type];return `<button type="button" class="node ${n.id===selected?'selected':''}" data-id="${escapeHtml(n.id)}" style="left:${p.x}px;top:${p.y}px" aria-label="${escapeHtml(n.name)}，右键打开节点菜单"><div class="node-body"><div class="node-head"><div class="node-icon ${n.type}">${kind.icon}</div><div><div class="node-name">${escapeHtml(n.name)}</div><div class="node-type">${kind.label}</div></div></div><div class="node-desc">${escapeHtml(n.desc)}</div></div><div class="node-footer"><span class="status"><span class="dot"></span>待运行</span><span class="hook">${n.hooks?.length?'<b>ϟ</b>Hook '+n.hooks.length:(n.pre||n.post?'<b>ϟ</b>旧标记':'—')}</span></div><div class="node-session" title="执行会话：${escapeHtml(sessionLabel(n))}">执行会话：${escapeHtml(sessionLabel(n))}</div></button>`}).join('')
}
function showMenu(node,x,y){selected=node.dataset.id;render();let menu=$('#menu');menu.classList.remove('hidden');menu.style.left=Math.min(x,innerWidth-menu.offsetWidth-8)+'px';menu.style.top=Math.min(y,innerHeight-menu.offsetHeight-8)+'px'}

function isDescendant(candidate,ancestor){let n=candidate;const seen=new Set();while(n&&!seen.has(n.id)){if(n.id===ancestor.id)return true;seen.add(n.id);n=nodes.find(x=>x.id===sessionParent(n))}return false}
function sessionOptions(current,action){const root=nodes.find(node=>node.parent===null);const parent=action==='add'?current:nodes.find(node=>node.id===current.parent);const select=$('#nodeForm').elements.executionSession;const isRoot=action==='edit'&&current.id===root?.id;select.innerHTML=isRoot?'<option value="root">根主会话</option>':`<option value="parent">父节点会话（默认）${parent?'：'+escapeHtml(parent.name):''}</option><option value="root">根主会话${root?'：'+escapeHtml(root.name):''}</option>`+nodes.filter(node=>node.type==='agent'&&(action!=='edit'||!isDescendant(node,current))&&node.id!==parent?.id).map(node=>`<option value="node:${escapeHtml(node.id)}">节点会话：${escapeHtml(node.name)}</option>`).join('');const choice=isRoot?'root':(action==='edit'?current.executionSession||'parent':'parent');if(!Array.from(select.options).some(option=>option.value===choice)){select.add(new Option('已选会话不可用',choice));}select.value=choice;select.disabled=isRoot;}
function updateSessionHint(){const form=$('#nodeForm'),select=form.elements.executionSession;const chosen=select.selectedOptions[0]?.textContent||'所选会话';$('#sessionHint').textContent=form.elements.type.value==='agent'?`此节点由「${chosen}」创建，是该会话所属 Agent 的子代理；子代理有自己的会话。实际可用性需运行时确认。`:'选择该节点使用的会话上下文；实际可用性需运行时确认。'}
$('#nodeForm').elements.type.addEventListener('change',updateSessionHint);
$('#nodeForm').elements.executionSession.addEventListener('change',updateSessionHint);
function dependsOn(id,target,seen=new Set()){if(id===target)return true;if(seen.has(id))return false;seen.add(id);return (nodes.find(n=>n.id===id)?.dependencies||[]).some(next=>dependsOn(next,target,seen))}
function renderDependencies(current,action,deps){
 const isRoot=action==='edit'&&current.parent===null;
 const redundant=id=>deps.some(other=>other!==id&&dependsOn(other,id));
 const candidates=isRoot?[]:nodes.filter(node=>action!=='edit'||node.id!==current.id).filter(node=>deps.includes(node.id)||((action!=='edit'||!dependsOn(node.id,current.id))&&!redundant(node.id)));
 $('#dependencyList').innerHTML=candidates.map(node=>{const checked=deps.includes(node.id),cycle=action==='edit'&&dependsOn(node.id,current.id);return `<label><input type="checkbox" name="dependency" value="${escapeHtml(node.id)}" ${checked?'checked':''}>${escapeHtml(node.name)}${cycle?'（无效依赖，请取消）':checked&&redundant(node.id)?'（已间接依赖，可取消）':''}</label>`}).join('')||(isRoot?'<span class="condition-hint">首节点是流程入口，不设置前置依赖。</span>':'<span class="condition-hint">暂无可选节点。</span>')
}
$('#dependencyList').addEventListener('change',()=>{const current=nodes.find(n=>n.id===selected);if(!current)return;const deps=Array.from(document.querySelectorAll('#dependencyList [name=dependency]:checked'),el=>el.value);renderDependencies(current,mode,deps)});
function openDialog(action){mode=action;let current=nodes.find(n=>n.id===selected);if(!current)return;let n=action==='edit'?current:{name:'新步骤',type:'agent',desc:'',template:'',pre:false,post:false,output:false,format:'JSON',path:'',hooks:[]};let form=$('#nodeForm');for(const key of ['name','type','desc','template'])form.elements[key].value=n[key]||'';const firstRoot=nodes.find(node=>node.parent===null);form.elements.type.disabled=action==='edit'&&current.id===firstRoot?.id;sessionOptions(current,action);updateSessionHint();const deps=action==='edit'?(current.dependencies||[]):[current.id];renderDependencies(current,action,deps);draftHooks=Array.isArray(n.hooks)?n.hooks.map(normalizeHook):[];legacyCleared=false;renderHookRows();$('#legacyNotice').classList.toggle('hidden',!(n.pre||n.post));$('#dialogTitle').textContent=action==='edit'?'编辑节点':'新增子节点';$('#menu').classList.add('hidden');$('#overlay').classList.remove('hidden');form.elements.name.focus();form.elements.name.select()}
$('#addHook').onclick=()=>{draftHooks.push(normalizeHook(null));renderHookRows();document.querySelectorAll('#hookRows .hook-select')[draftHooks.length-1]?.focus()};function updateHookField(e){const input=e.target,field=input.dataset.hookField;if(!field)return;const hook=draftHooks[Number(input.dataset.index)];if(!hook)return;if(field==='event'){hook.event=input.value;input.closest('.hook-card').querySelector('.next-condition').classList.toggle('hidden',input.value!=='orchestrator/node-end')}else if(field==='action'||field==='nextCondition')hook[field]=input.value;else if(field==='enabled'){hook.output.enabled=input.checked;const section=input.closest('.hook-card').querySelector('.hook-output-fields');section.classList.toggle('hidden',!input.checked);section.querySelector('[data-hook-field="path"]').required=input.checked}else hook.output[field]=input.value}$('#hookRows').addEventListener('input',updateHookField);$('#hookRows').addEventListener('change',updateHookField);$('#hookRows').addEventListener('click',e=>{const button=e.target.closest('[data-remove]');if(!button)return;draftHooks.splice(Number(button.dataset.remove),1);renderHookRows()});$('#clearLegacy').onclick=()=>{legacyCleared=true;$('#legacyNotice').classList.add('hidden')};
$('#editNode').onclick=()=>openDialog('edit');$('#addChild').onclick=()=>openDialog('add');
function closeDialog(){$('#overlay').classList.add('hidden')};$('#closeDialog').onclick=closeDialog;$('#cancel').onclick=closeDialog;$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeDialog()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();$('#menu').classList.add('hidden')}});
$('#nodeForm').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget,name=form.elements.name.value.trim();if(!name){form.elements.name.focus();return}const firstRoot=nodes.find(node=>node.parent===null);const dependencies=Array.from(form.querySelectorAll('[name=dependency]:checked'),el=>el.value);if(mode==='edit'){if(dependencies.some(id=>dependsOn(id,selected))){showToast('前置依赖不能形成循环');return}}const data={name,dependencies,type:mode==='edit'&&selected===firstRoot?.id?'main':form.elements.type.value,executionSession:mode==='edit'&&selected===firstRoot?.id?'root':form.elements.executionSession.value,desc:form.elements.desc.value.trim(),template:form.elements.template.value.trim(),hooks:draftHooks.map(hook=>({event:hook.event,action:hook.action.trim(),nextCondition:hook.nextCondition.trim(),output:{...hook.output,path:hook.output.path.trim()}}))};if(mode==='edit'){let target=nodes.find(n=>n.id===selected);Object.assign(target,data);if(legacyCleared){delete target.pre;delete target.post}}else{const id='node-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);nodes.push({id,parent:selected,...data});selected=id}save();closeDialog();render();if(mode==='add')document.querySelector(`[data-id="${selected}"]`)?.scrollIntoView({block:'nearest',inline:'nearest'});showToast(mode==='edit'?'节点已更新':'子节点已添加')});
